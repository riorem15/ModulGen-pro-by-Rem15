<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gradMainLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gradGoldLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#gradMainLogo)" filter="url(#glowLogo)"/>
  
  <!-- Subtle Internal Glow Outline -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>

  <!-- Stylized Open Book / Layers of Modul -->
  <path d="M16 42C21 39 27 39 32 41C37 39 43 39 48 42V23C43 20 37 20 32 22C27 20 21 20 16 23V42Z" fill="white" fill-opacity="0.95"/>
  <path d="M32 22V41" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <path d="M19 28C23 26 27 26 31 27" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M19 33C23 31 27 31 31 32" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M33 27C37 26 41 26 45 28" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M33 32C37 31 41 31 45 33" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glowing AI Sparkle Star on Top Center -->
  <path d="M32 9L34.2 14.8L40 17L34.2 19.2L32 25L29.8 19.2L24 17L29.8 14.8L32 9Z" fill="url(#gradGoldLogo)"/>
  
  <!-- Small Star Accent -->
  <circle cx="45" cy="15" r="2" fill="#FDE68A"/>
</svg>
